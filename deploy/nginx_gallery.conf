server {
    listen 80;
    # 改成你的域名或 Oracle VM 公网 IP；有域名后可用 certbot 加 HTTPS
    server_name _;

    # 上传图片最大 10MB（后端也限 10MB），这里留点余量
    client_max_body_size 20m;

    # 上传的图片等静态资源由 nginx 直接提供，省掉 Python 的开销
    # alias 指向项目里的 uploads/ 目录（按实际路径修改）
    location /static/ {
        alias /home/ubuntu/gallery/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 其余请求（API / 后台页面 /admin）转发给 uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
